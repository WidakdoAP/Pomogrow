name: pomogrow
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Introduction
  introduction_screen: ^4.0.0
  # App Icon
  flutter_launcher_icons: ^0.14.4
  # Shared Prefs
  shared_preferences: ^2.5.3
  # Flutter SVG
  flutter_svg: ^2.2.1
  # State Management
  flutter_riverpod: ^3.0.3
  # Log Info
  logging: ^1.3.0
  # Supabase :3
  supabase_flutter: ^2.10.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/pomogrow.svg
    - assets/icons/google.svg
    - assets/icons/title.svg
    - assets/images/background_signin.jpg
    - assets/images/onboarding_tree.png
    - assets/images/onboarding_dead.png
    - assets/images/onboarding_fields.png
    - assets/images/onboarding_timer.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

# App Icon
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#B6DB9F"
  min_sdk_android: 21
